name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # The HTTP tests use an in-memory repository, so no MySQL is needed here.
      - run: npm run test:e2e
